name: MLflow CI - Train Model
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  train:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
 
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
 
      - name: Install Dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib seaborn joblib dagshub
 
      # ✅ PERBAIKAN: Gunakan perintah mlflow run (bukan cd + python manual)
      - name: Run MLflow Project
        run: |
          mlflow run MLproject --env-manager=local
 
      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_number }}
          path: MLproject/mlruns/
          retention-days: 30
 
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
 
      - name: Get Latest MLflow run_id
        run: |
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"
 
      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "heartdisease-model"
 
      - name: Tag Docker Image
        run: |
          docker tag heartdisease-model ${{ secrets.DOCKER_HUB_USERNAME }}/heartdisease-model:latest
 
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/heartdisease-model:latest
